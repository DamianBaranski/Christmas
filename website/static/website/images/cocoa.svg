  <rect x="42" y="172" width="100" height="14" rx="2" fill="#a8322a"/>
  <rect x="136" y="172" width="6" height="14" fill="#e9c46a"/>

  <g fill="none" stroke="#f3ead8" stroke-width="4" stroke-linecap="round">
    <path class="steam" d="M74 112 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path class="steam s2" d="M90 114 q-8 -10 0 -20 q8 -10 0 -20"/>
    <path class="steam s3" d="M106 112 q-8 -10 0 -20 q8 -10 0 -20"/>
  </g>
  <path d="M120 136 q26 2 24 18 q-2 14 -26 12" fill="none" stroke="#c4302b" stroke-width="7"/>
  <path d="M60 122 H122 L118 166 Q117 172 110 172 H72 Q65 172 64 166 Z" fill="#c4302b"/>
  <ellipse cx="91" cy="122" rx="31" ry="6" fill="#6b3e26"/>
