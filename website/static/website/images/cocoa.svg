    <path d="M78 140 l3 6 l3 -6 l-3 -2 z"/><path d="M96 150 l3 6 l3 -6 l-3 -2 z"/>
    <circle cx="104" cy="136" r="2"/><circle cx="76" cy="156" r="2"/>
  </g>

  <circle cx="196" cy="150" r="44" fill="url(#cg)"/>
  <rect x="172" y="146" width="48" height="54" rx="8" fill="#f3ead8" opacity=".25" stroke="#f3ead8" stroke-opacity=".5" stroke-width="2"/>
  <rect x="182" y="158" width="28" height="42" rx="3" fill="#f6ecd8"/>
  <path d="M196 158 v-6" stroke="#3a2418" stroke-width="2"/>
