<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360">
  <style>
    .steam { animation: rise 3.2s ease-in-out infinite; opacity: 0; }
    .s2 { animation-delay: 1.05s; } .s3 { animation-delay: 2.1s; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(8px); }
      30%  { opacity: .75; }
      100% { opacity: 0; transform: translateY(-26px); }
    }
    .flame { transform-origin: 196px 148px; animation: fl .5s ease-in-out infinite alternate; }
    @keyframes fl { from { transform: scale(1, 1); } to { transform: scale(.85, 1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .steam { opacity: .5; } }
  </style>
  <defs>
    <radialGradient id="cg">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="352" rx="110" ry="8" fill="#000" opacity=".25"/>
  <rect x="44" y="214" width="12" height="138" rx="3" fill="#5a3320"/>
  <rect x="204" y="214" width="12" height="138" rx="3" fill="#5a3320"/>
  <rect x="50" y="300" width="160" height="8" rx="3" fill="#5a3320"/>
  <rect x="20" y="200" width="220" height="18" rx="5" fill="#7a4a30"/>
  <rect x="20" y="200" width="220" height="5" rx="3" fill="#94603f"/>

  <rect x="34" y="186" width="116" height="14" rx="2" fill="#2f6b4f"/>
