<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380">
  <style>
    /* hammer swings down onto the toy every 0.9 s */
    .hammer-arm { transform-origin: 214px 158px; animation: hammer .9s ease-in infinite; }
    @keyframes hammer {
      0%   { transform: rotate(-58deg); }
      55%  { transform: rotate(-58deg); animation-timing-function: cubic-bezier(.6, 0, 1, 1); }
      78%  { transform: rotate(6deg); }
      100% { transform: rotate(-58deg); }
    }
    .spark { transform-origin: 262px 196px; animation: spark .9s linear infinite; opacity: 0; }
    @keyframes spark {
      0%, 76% { opacity: 0; transform: scale(.4); }
      80%     { opacity: 1; transform: scale(1.1); }
      95%     { opacity: 0; transform: scale(1.4); }
      100%    { opacity: 0; }
    }
    .elf-head { transform-origin: 180px 146px; animation: bob .9s ease-in-out infinite; }
    @keyframes bob { 0%, 70%, 100% { transform: rotate(0deg); } 80% { transform: rotate(2deg) translateY(1px); } }
    .bell { transform-origin: 204px 36px; animation: ring 1.8s ease-in-out infinite; }
    @keyframes ring { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .hammer-arm { transform: rotate(-30deg); } }
  </style>
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fff"/><rect width="12" height="6" fill="#d42f3a"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a4f"/><stop offset="1" stop-color="#8a5a37"/>
    </linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34a866"/><stop offset="1" stop-color="#23804c"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="366" rx="176" ry="10" fill="#000" opacity=".25"/>

  <!-- elf, full body, standing behind the table -->
  <!-- legs in striped stockings + curly shoes -->
  <rect x="160" y="252" width="17" height="84" fill="url(#stripes)"/>
  <rect x="184" y="252" width="17" height="84" fill="url(#stripes)"/>
  <path d="M178 334 v12 h-30 q-14 0 -18 -12 q-2 -8 6 -6 q4 6 12 6 z" fill="#2f9e5f"/>
  <path d="M183 334 v12 h30 q14 0 18 -12 q2 -8 -6 -6 q-4 6 -12 6 z" fill="#2f9e5f"/>
  <circle cx="132" cy="326" r="4" fill="#ffd34d"/><circle cx="229" cy="326" r="4" fill="#ffd34d"/>
  <!-- tunic -->
  <path d="M140 172 Q138 150 160 148 H200 Q222 150 220 172 L226 258 H134 Z" fill="url(#tunic)"/>
  <path d="M134 256 l8 10 l8 -10 l8 10 l8 -10 l8 10 l8 -10 l8 10 l8 -10 l8 10 l8 -10 l8 10 l4 -6 V256 Z" fill="#d42f3a"/>
  <path d="M146 146 l8 12 l8 -12 l8 12 l8 -12 l8 12 l8 -12 l8 12 l8 -12 l6 10 H146 Z" fill="#d42f3a"/>
  <rect x="137" y="212" width="86" height="11" fill="#2b2140"/>
  <rect x="172" y="210" width="16" height="15" rx="2" fill="none" stroke="#ffd34d" stroke-width="3"/>
  <g fill="#ffd34d"><circle cx="180" cy="178" r="3"/><circle cx="180" cy="194" r="3"/></g>
  <g class="elf-head">
    <path d="M150 112 L124 98 L146 124 Z" fill="#ffcfa8"/>
    <path d="M210 112 L236 98 L214 124 Z" fill="#ffcfa8"/>
    <circle cx="180" cy="114" r="30" fill="#ffd9b8"/>
    <path d="M152 100 q-6 10 0 18 M208 100 q6 10 0 18" stroke="#8a4b2a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="169" cy="112" r="3.4" fill="#2b2140"/>
    <circle cx="191" cy="112" r="3.4" fill="#2b2140"/>
    <circle cx="170" cy="111" r="1.1" fill="#fff"/><circle cx="192" cy="111" r="1.1" fill="#fff"/>
    <circle cx="163" cy="123" r="6" fill="#ff8a8a" opacity=".55"/>
    <circle cx="197" cy="123" r="6" fill="#ff8a8a" opacity=".55"/>
    <circle cx="180" cy="119" r="4" fill="#f5a98a"/>
    <path d="M171 129 q9 8 18 0" stroke="#2b2140" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M146 96 Q154 46 198 34 Q184 62 214 96 Z" fill="#d42f3a"/>
    <path d="M142 90 h76 a7 7 0 0 1 0 14 h-76 a7 7 0 0 1 0 -14 Z" fill="#fff"/>
    <g fill="#2f9e5f"><circle cx="152" cy="97" r="3"/><circle cx="168" cy="97" r="3"/><circle cx="184" cy="97" r="3"/><circle cx="200" cy="97" r="3"/><circle cx="214" cy="97" r="3"/></g>
    <g class="bell"><path d="M204 34 v4" stroke="#b8860b" stroke-width="2"/><circle cx="204" cy="44" r="7" fill="#ffd34d"/><circle cx="204" cy="47" r="2" fill="#b8860b"/></g>
  </g>

  <!-- big workbench in front of the elf (his legs show underneath) -->
  <rect x="6" y="210" width="348" height="24" rx="5" fill="url(#wood)"/>
  <rect x="6" y="210" width="348" height="6" rx="3" fill="#c48e60"/>
  <rect x="16" y="234" width="328" height="12" fill="#7a4a30"/>
  <path d="M30 240 h300" stroke="#5e3822" stroke-width="2" opacity=".6"/>
  <rect x="20" y="246" width="18" height="114" rx="2" fill="#7a4a30"/>
  <rect x="322" y="246" width="18" height="114" rx="2" fill="#7a4a30"/>
  <rect x="38" y="322" width="38" height="8" rx="2" fill="#6b3e26"/>
  <rect x="284" y="322" width="38" height="8" rx="2" fill="#6b3e26"/>

  <!-- things on the table -->
  <g>
    <rect x="30" y="184" width="38" height="26" fill="#d42f3a"/>
    <ellipse cx="49" cy="184" rx="19" ry="6" fill="#f3ead8"/>
    <ellipse cx="49" cy="210" rx="19" ry="4" fill="#b52b25"/>
    <path d="M30 188 l9.5 18 l9.5 -18 l9.5 18 l9.5 -18" stroke="#ffd34d" stroke-width="2.5" fill="none"/>
    <path d="M38 172 l8 10 M62 172 l-8 10" stroke="#8a5a37" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="80" y="190" width="30" height="20" rx="2" fill="#7b5cd6"/><rect x="92" y="190" width="6" height="20" fill="#ffd34d"/>
    <rect x="84" y="174" width="22" height="16" rx="2" fill="#2f9e5f"/><rect x="92" y="174" width="6" height="16" fill="#fff"/>
  </g>
  <g>
    <rect x="300" y="186" width="34" height="24" rx="2" fill="#4db8ff"/><rect x="314" y="186" width="6" height="24" fill="#fff"/>
    <path d="M317 186 q-9 -9 -13 -2 q4 5 13 2 q9 -9 13 -2 q-4 5 -13 2" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- toy car being hammered -->
  <g>
    <path d="M236 196 h54 v12 h-60 Z" fill="#4db8ff"/>
    <path d="M246 196 l6 -12 h22 l8 12 Z" fill="#3a95d6"/>
    <rect x="256" y="187" width="9" height="8" fill="#e8f6ff"/><rect x="268" y="187" width="9" height="8" fill="#e8f6ff"/>
    <circle cx="244" cy="210" r="6" fill="#2b2140"/><circle cx="280" cy="210" r="6" fill="#2b2140"/>
    <circle cx="244" cy="210" r="2" fill="#ccc"/><circle cx="280" cy="210" r="2" fill="#ccc"/>
  </g>
  <g class="spark" fill="#ffe36b">
    <path d="M262 180 l3 10 l10 -4 l-7 8 l9 6 l-11 0 l-2 10 l-4 -10 l-10 3 l7 -8 l-8 -7 l11 1 Z"/>
  </g>



  <!-- left hand resting on the table -->
  <path d="M146 162 Q126 186 138 206" stroke="url(#tunic)" stroke-width="17" stroke-linecap="round" fill="none"/>
  <circle cx="139" cy="207" r="8" fill="#ffd9b8"/>

  <!-- right arm with hammer -->
  <g class="hammer-arm">
    <path d="M214 158 Q236 172 246 190" stroke="url(#tunic)" stroke-width="17" stroke-linecap="round" fill="none"/>
    <circle cx="247" cy="192" r="8" fill="#ffd9b8"/>
    <path d="M247 192 L262 172" stroke="#8a5a37" stroke-width="6" stroke-linecap="round"/>
    <rect x="252" y="160" width="26" height="14" rx="3" fill="#6d7a86" transform="rotate(37 265 167)"/>
  </g>

</svg>
