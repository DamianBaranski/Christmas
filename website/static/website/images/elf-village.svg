<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 220 1600 180" preserveAspectRatio="xMidYMax slice">
  <style>
    .sparkle { animation: sp 2.6s ease-in-out infinite; opacity: 0; }
    @keyframes sp { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    .train { animation: chug 34s linear infinite; }
    @keyframes chug { from { transform: translateX(-260px); } to { transform: translateX(1700px); } }
    .puff circle { animation: tw .5s ease-in-out infinite alternate; }
    @keyframes tw { from { opacity: .35; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sparkle { opacity: .8; } .train { transform: translateX(240px); } }
  </style>
