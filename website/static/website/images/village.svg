<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" preserveAspectRatio="xMidYMax slice">
  <style>
    .smoke circle { animation: puff 4s ease-out infinite; opacity: 0; }
    .smoke circle:nth-child(2) { animation-delay: 1.3s; }
    .smoke circle:nth-child(3) { animation-delay: 2.6s; }
    @keyframes puff {
      0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
      20%  { opacity: .85; }
      100% { opacity: 0; transform: translate(14px, -46px) scale(1.5); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .smoke circle { opacity: .6; } }
  </style>
  <defs>
    <symbol id="pine" viewBox="0 0 40 80">
      <path d="M20 0 L34 26 H27 L38 48 H29 L40 70 H0 L11 48 H2 L13 26 H6 Z" fill="#2f6b4f"/>
      <path d="M20 0 L28 15 Q20 19 12 15 Z M9 30 Q20 35 31 30 L27 26 H13 Z M6 52 Q20 58 34 52 L29 48 H11 Z" fill="#fff"/>
      <rect x="17" y="70" width="6" height="10" fill="#6b3e26"/>
    </symbol>
    <g id="smoke" class="smoke" fill="#fff">
      <circle cx="0" cy="0" r="7"/><circle cx="0" cy="0" r="7"/><circle cx="0" cy="0" r="7"/>
    </g>
    <linearGradient id="snowFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe9f8"/>
    </linearGradient>
  </defs>

  <!-- distant hills -->
  <path d="M0 230 C220 160 420 190 640 210 C860 230 1060 150 1280 170 C1440 185 1520 200 1600 195 V380 H0 Z" fill="#e3f0fc"/>
  <g opacity=".55">
    <use href="#pine" x="180" y="176" width="22" height="44"/>
    <use href="#pine" x="205" y="186" width="16" height="32"/>
    <use href="#pine" x="1060" y="160" width="22" height="44"/>
    <use href="#pine" x="1500" y="176" width="20" height="40"/>
  </g>

  <!-- middle ground -->
  <path d="M0 280 C260 240 520 250 800 268 C1080 286 1300 236 1600 254 V380 H0 Z" fill="#f4f9ff"/>

  <!-- houses -->
  <g>
    <!-- red house -->
    <use href="#smoke" x="356" y="186"/>
    <rect x="350" y="190" width="14" height="30" fill="#7a4a30"/>
    <rect x="300" y="226" width="96" height="62" fill="#d9534f"/>
    <polygon points="290,230 348,186 406,230" fill="#7a3a2c"/>
    <path d="M288 232 L348 184 L408 232 Q392 222 348 194 Q304 222 288 232 Z" fill="#fff"/>
    <rect x="316" y="244" width="22" height="20" fill="#ffe8a3" stroke="#fff" stroke-width="3"/>
    <rect x="356" y="250" width="22" height="38" fill="#7a3a2c"/>

    <!-- yellow house -->
    <use href="#smoke" x="486" y="196"/>
    <rect x="480" y="200" width="12" height="28" fill="#7a4a30"/>
    <rect x="420" y="236" width="110" height="56" fill="#f4c95d"/>
    <polygon points="408,240 475,198 542,240" fill="#a35f2b"/>
    <path d="M406 242 L475 196 L544 242 Q526 232 475 206 Q424 232 406 242 Z" fill="#fff"/>
    <rect x="436" y="252" width="20" height="18" fill="#9fd3ff" stroke="#fff" stroke-width="3"/>
    <rect x="494" y="252" width="20" height="18" fill="#9fd3ff" stroke="#fff" stroke-width="3"/>

    <!-- church -->
    <rect x="760" y="196" width="60" height="96" fill="#f2ead9"/>
    <polygon points="752,200 790,130 828,200" fill="#5b8bd9"/>
    <path d="M750 202 L790 128 L830 202 Q818 192 790 140 Q762 192 750 202 Z" fill="#fff" opacity=".9"/>
    <path d="M790 104 V128 M780 112 H800" stroke="#c9a03c" stroke-width="4"/>
    <circle cx="790" cy="222" r="10" fill="#c9a03c"/>
    <path d="M778 292 V262 Q790 248 802 262 V292 Z" fill="#7a4a30"/>
    <rect x="820" y="236" width="90" height="56" fill="#efe5d2"/>
    <polygon points="812,240 865,212 918,240" fill="#5b8bd9"/>
    <path d="M810 242 L865 210 L920 242 Q900 234 865 220 Q830 234 810 242 Z" fill="#fff"/>
    <rect x="836" y="252" width="14" height="22" rx="7" fill="#ffe8a3"/>
    <rect x="876" y="252" width="14" height="22" rx="7" fill="#ffe8a3"/>

    <!-- teal house -->
    <use href="#smoke" x="1134" y="180"/>
    <rect x="1128" y="184" width="14" height="30" fill="#7a4a30"/>
    <rect x="1060" y="220" width="104" height="64" fill="#4fa3a5"/>
    <polygon points="1050,224 1112,178 1174,224" fill="#2d6466"/>
    <path d="M1048 226 L1112 176 L1176 226 Q1158 216 1112 186 Q1066 216 1048 226 Z" fill="#fff"/>
    <rect x="1076" y="238" width="22" height="20" fill="#ffe8a3" stroke="#fff" stroke-width="3"/>
    <rect x="1124" y="246" width="22" height="38" fill="#2d6466"/>
    <circle cx="1135" cy="234" r="9" fill="none" stroke="#2f6b4f" stroke-width="5"/>
    <circle cx="1135" cy="243" r="2.5" fill="#d9534f"/>

    <!-- blue house -->
    <rect x="1190" y="238" width="86" height="50" fill="#5b8bd9"/>
    <polygon points="1180,242 1233,206 1286,242" fill="#2e4f8c"/>
    <path d="M1178 244 L1233 204 L1288 244 Q1272 236 1233 214 Q1194 236 1178 244 Z" fill="#fff"/>
    <rect x="1204" y="252" width="18" height="16" fill="#9fd3ff" stroke="#fff" stroke-width="3"/>
    <rect x="1244" y="252" width="18" height="16" fill="#9fd3ff" stroke="#fff" stroke-width="3"/>
  </g>

  <g>
    <use href="#pine" x="240" y="214" width="40" height="80"/>
    <use href="#pine" x="560" y="222" width="34" height="68"/>
    <use href="#pine" x="600" y="236" width="26" height="52"/>
    <use href="#pine" x="700" y="220" width="36" height="72"/>
    <use href="#pine" x="960" y="226" width="34" height="68"/>
    <use href="#pine" x="1000" y="240" width="24" height="48"/>
    <use href="#pine" x="1310" y="214" width="40" height="80"/>
    <use href="#pine" x="1360" y="236" width="28" height="56"/>
    <use href="#pine" x="60" y="236" width="30" height="60"/>
  </g>

  <!-- fence -->
  <g stroke="#a7784f" stroke-width="5" stroke-linecap="round">
    <path d="M420 312 H640"/>
    <path d="M430 300 V322 M466 300 V322 M502 300 V322 M538 300 V322 M574 300 V322 M610 300 V322"/>
  </g>
  <g fill="#fff"><circle cx="430" cy="298" r="4"/><circle cx="466" cy="298" r="4"/><circle cx="502" cy="298" r="4"/><circle cx="538" cy="298" r="4"/><circle cx="574" cy="298" r="4"/><circle cx="610" cy="298" r="4"/></g>

  <!-- foreground snow -->
  <path d="M0 330 C300 296 620 312 920 336 C1180 356 1400 304 1600 320 V380 H0 Z" fill="url(#snowFront)"/>
</svg>
