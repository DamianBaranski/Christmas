<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMax slice">
  <style>
    .smoke circle { animation: puff 4s ease-out infinite; opacity: 0; }
    .smoke circle:nth-child(2) { animation-delay: 1.3s; }
    .smoke circle:nth-child(3) { animation-delay: 2.6s; }
    @keyframes puff {
      0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
      20%  { opacity: .85; }
      100% { opacity: 0; transform: translate(16px, -50px) scale(1.6); }
    }
    .bulb { animation: tw 1.4s ease-in-out infinite alternate; }
    .b1 { animation-delay: .45s; } .b2 { animation-delay: .9s; }
    @keyframes tw { from { opacity: .35; } to { opacity: 1; } }
    .sparkle { animation: sp 2.6s ease-in-out infinite; opacity: 0; }
    @keyframes sp { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    .star { animation: tw 1.8s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .smoke circle { opacity: .6; } .sparkle { opacity: .8; } }
  </style>
