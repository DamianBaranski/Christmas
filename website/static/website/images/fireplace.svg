      <path d="M0 0.5 H40 M0 10.5 H40 M0.5 0 V10 M20.5 10 V20" stroke="#6e2c20" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="inner" cx=".5" cy=".9" r=".8">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#7a2a10" stop-opacity=".6"/>
      <stop offset="1" stop-color="#1a0b06"/>
    </radialGradient>
    <linearGradient id="flameO" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="flameY" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd25e"/><stop offset="1" stop-color="#fff3c0"/>
    </linearGradient>
    <g id="stocking">
