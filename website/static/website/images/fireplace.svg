<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420">
  <style>
    .f1 { transform-origin: 170px 352px; animation: flick 0.9s ease-in-out infinite alternate; }
    .f2 { transform-origin: 170px 352px; animation: flick 0.7s ease-in-out infinite alternate-reverse; }
    .f3 { transform-origin: 170px 352px; animation: flick 1.1s ease-in-out infinite alternate; }
    @keyframes flick {
      from { transform: scale(1, 1) skewX(0deg); }
      to   { transform: scale(0.94, 1.08) skewX(3deg); }
    }
    .bl { animation: tw 1.5s ease-in-out infinite alternate; }
    .bl2 { animation-delay: .75s; }
    @keyframes tw { from { opacity: .45; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
